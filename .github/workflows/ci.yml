name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    name: Backend Tests (FastAPI & Django)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install root dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run root pytest suite (44 tests)
        run: |
          python -m pytest -v

      - name: Install Django dependencies
        run: |
          pip install -r django_gateway/requirements.txt

      - name: Run Django gateway tests (30 tests)
        env:
          DJANGO_DEBUG: "True"
        run: |
          cd django_gateway
          python manage.py test

  frontend-build:
    name: Frontend Test & Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend_next/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend_next
        run: npm ci

      - name: Run fallback & integrity test
        working-directory: ./frontend_next
        run: npm test

      - name: Build Next.js production bundle
        working-directory: ./frontend_next
        run: npm run build
