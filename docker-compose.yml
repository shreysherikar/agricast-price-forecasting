services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: forecasting_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}
      POSTGRES_DB: ${POSTGRES_DB:-forecasting_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-forecasting_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. FastAPI Forecasting & Inference Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: forecasting_api
    environment:
      ARTIFACTS_DIR: /app/outputs
      DATA_PATH: /app/data/prices.csv
      FORECAST_API_KEY: ${FORECAST_API_KEY:-dev-forecast-key-change-in-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PYTHONUNBUFFERED: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 3. Django Gateway Service
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: forecasting_gateway
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}@db:5432/${POSTGRES_DB:-forecasting_db}
      FASTAPI_BASE_URL: http://api:8000
      FASTAPI_TIMEOUT_SECONDS: "3.0"
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-django-secret-key-change-in-prod}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # 4. React Decision Support Frontend Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: forecasting_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
